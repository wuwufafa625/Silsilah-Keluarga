<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silsilah Keluarga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #142235;
    --bg-deep-2: #1C3049;
    --parchment: #FAF6EC;
    --parchment-alt: #F1E9D6;
    --gold: #C9A227;
    --gold-dark: #8F6E12;
    --clay: #A64B2A;
    --clay-soft: #F2E0D3;
    --text: #241F19;
    --text-muted: #7B715E;
    --text-inverse: #F7F1E1;
    --border: #E2D7BC;
    --radius: 14px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--parchment);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .name{ font-family: 'Fraunces', serif; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  header.hero{
    background: linear-gradient(180deg, var(--bg-deep), var(--bg-deep-2));
    color: var(--text-inverse);
    padding: 2rem 1.25rem 2.75rem;
    position: relative;
  }
  header.hero .eyebrow{
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 .4rem;
    font-weight: 500;
  }
  header.hero h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0 0 .3rem;
    line-height: 1.15;
  }
  header.hero p{
    margin: 0;
    font-size: 13px;
    color: #B9C3D0;
  }

  .search-wrap{
    max-width: 640px;
    margin: -1.5rem auto 0;
    padding: 0 1.25rem;
    position: relative;
    z-index: 2;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 14px;
    height: 46px;
    box-shadow: 0 6px 18px rgba(20,34,53,0.18);
  }
  .search-box svg{ flex-shrink:0; opacity:.55; }
  .search-box input{
    border:none; outline:none; background:transparent;
    flex:1; height:100%; font-size:14px; font-family:inherit; color:var(--text);
  }
  .search-box input::placeholder{ color: var(--text-muted); }

  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
  }

  .stats{
    display:flex; gap:10px; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .stat-pill{
    font-size: 12px;
    color: var(--text-muted);
    background: var(--parchment-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .gen-block{ margin-bottom: 14px; }
  .gen-header{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    background: var(--parchment-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    text-align:left;
    font-family: inherit;
  }
  .gen-header .left{ display:flex; align-items:baseline; gap:8px; }
  .gen-header .roman{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--clay);
  }
  .gen-header .count{ font-size: 12px; color: var(--text-muted); }
  .gen-header .chev{ transition: transform .15s ease; opacity:.6; }
  .gen-header.open .chev{ transform: rotate(180deg); }

  .gen-body{
    position: relative;
    padding: 14px 0 2px 22px;
    margin-left: 6px;
  }
  .thread{
    position:absolute;
    left: 5px; top: 0; bottom: 14px;
    width: 2px;
    background: var(--gold);
    opacity:.6;
  }

  .person-row{ position: relative; margin-bottom: 10px; }
  .node-dot{
    position:absolute; left:-19px; top:18px;
    width:8px; height:8px; transform: rotate(45deg);
    background: var(--gold); border-radius: 2px;
  }

  .card{
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .card .row{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width: 38px; height:38px; border-radius: 50%;
    background: var(--clay-soft); color: var(--clay);
    display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 600; flex-shrink:0;
  }
  .who{ flex:1; min-width:0; }
  .who .nm{
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .who .meta{ font-size: 11.5px; color: var(--text-muted); margin-top:1px; }
  .kk-badge{
    font-size: 10.5px; color: var(--gold-dark);
    background: #FBF2D8; border: 1px solid #EBD98F;
    border-radius: 6px; padding: 2px 6px; flex-shrink:0;
  }

  .detail{
    padding: 10px 4px 2px 48px;
    font-size: 12.5px; color: var(--text-muted);
  }
  .detail .line{ margin-bottom: 6px; }
  .detail b{ color: var(--text); font-weight: 500; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 4px; }
  .chip{
    font-size: 11.5px;
    background: var(--parchment-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .chip:hover{ border-color: var(--gold); }

  .empty, .loading{
    text-align:center; color: var(--text-muted); font-size: 13px;
    padding: 2.5rem 1rem;
  }
  .config-note{
    font-size: 12px; color: var(--clay);
    background: var(--clay-soft);
    border: 1px solid #E4C1A6;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 1.25rem;
  }
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow">Silsilah keluarga</p>
  <h1 id="familyTitle">Keluarga Besar</h1>
  <p id="familySubtitle">Menelusuri garis keturunan, generasi demi generasi.</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Cari nama anggota keluarga">
  </div>
</div>

<main>
  <div id="configNote" class="config-note" style="display:none;">
    Data sampel sedang ditampilkan. Ganti <span class="mono">SHEET_CSV_URL</span> di bagian atas kode dengan link CSV Google Sheets kamu sendiri.
  </div>
  <div id="stats" class="stats"></div>
  <div id="loading" class="loading">Memuat data keluarga…</div>
  <div id="tree"></div>
  <div id="emptyState" class="empty" style="display:none;">Tidak ada nama yang cocok.</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =========================================================================
   CARA PAKAI
   1. Di Google Sheets: File > Share > Publish to web > pilih sheet "Anggota"
      > format CSV > Publish. Salin link yang muncul.
   2. Tempel link itu ke SHEET_CSV_URL di bawah ini.
   3. Kolom yang WAJIB ada di sheet (urutan bebas, header harus sama persis):
      id, nama, kk, status_kk, lahir, wafat, id_ortu, id_pasangan, keterangan
      - id            : kode unik, mis. P001
      - id_ortu       : id salah satu orang tua kandung (kosong kalau leluhur/menikah masuk)
      - id_pasangan   : id pasangan (suami/istri), kosong kalau belum/tidak ada
      - kk            : nomor/label kartu keluarga, bebas formatnya
   4. Ganti FAMILY_TITLE / FAMILY_SUBTITLE sesuai nama keluarga besar kamu.
   ========================================================================= */

  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXTxGZBb2t4SAhQn1WnhJa4Vu4nCTwLbjWyd8YzIWq5yBZ9U4hD3-ty6tWc3Rq2eGeN69wiZ6RwQ4O/pub?gid=0&single=true&output=csv";
  const FAMILY_TITLE = "Keluarga Besar kasnawi Jawul";
  const FAMILY_SUBTITLE = "Menelusuri garis keturunan, generasi demi generasi.";

  const SAMPLE_CSV = `id,nama,kk,status_kk,lahir,wafat,id_ortu,id_pasangan,keterangan
P001,Suryanto kasnawi Jawul,KK01,Kepala Keluarga,1928,2005,,P001b,Pendiri keluarga
P001b,Rahayu kasnawi Jawul,KK01,Istri,1932,2010,,P001,
P002,Bambang Suryanto,KK02,Kepala Keluarga,1955,,P001,P002b,Anak pertama
P002b,Ningsih,KK02,Istri,1958,,,P002,Menikah dari luar keluarga
P003,Siti Suryani,KK03,Kepala Keluarga,1958,,P001,P003b,Anak kedua
P003b,Herman Kusuma,KK03,Suami,1956,,,P003,Menantu
P004,Herman Suryanto,KK04,Kepala Keluarga,1962,,P001,,Anak ketiga, belum menikah
P005,Dewi Anggraini,KK05,Kepala Keluarga,1980,,P002,P005b,Cucu dari Bambang
P005b,Rudi Hartono,KK05,Suami,1978,,,P005,Menantu
P006,Wulan Sari,KK03,Anak,1985,,P003,,Cucu dari Siti
P007,Adi Nugraha,KK04,Anak,1990,,P004,,Cucu dari Herman
P008,Bagas kasnawi Jawul,KK05,Anak,2006,,P005,,Cicit dari Bambang`;

  document.getElementById('familyTitle').textContent = FAMILY_TITLE;
  document.getElementById('familySubtitle').textContent = FAMILY_SUBTITLE;

  let people = {};
  let openGen = {};
  let openMember = null;
  let query = "";

  function romanize(n){
    const map = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
    return map[n] || (n+1);
  }

  function initialsOf(name){
    return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }

  function computeGenerations(list){
    const byId = {};
    list.forEach(p => byId[p.id] = p);
    const depth = {};
    let changed = true;
    let guard = 0;
    while(changed && guard < 50){
      changed = false;
      guard++;
      list.forEach(p => {
        if(depth[p.id] !== undefined) return;
        if(!p.id_ortu){
          if(!p.id_pasangan){
            depth[p.id] = 0; changed = true;
          } else if(depth[p.id_pasangan] !== undefined){
            depth[p.id] = depth[p.id_pasangan]; changed = true;
          } else if(byId[p.id_pasangan] && !byId[p.id_pasangan].id_ortu){
            depth[p.id] = 0; changed = true;
          }
        } else if(depth[p.id_ortu] !== undefined){
          depth[p.id] = depth[p.id_ortu] + 1; changed = true;
        }
      });
    }
    list.forEach(p => { if(depth[p.id] === undefined) depth[p.id] = 0; });
    return depth;
  }

  function buildTree(csvText){
    const parsed = Papa.parse(csvText.trim(), { header: true, skipEmptyLines: true });
    const list = parsed.data.map(r => ({
      id: (r.id||"").trim(),
      nama: (r.nama||"").trim(),
      kk: (r.kk||"").trim(),
      status_kk: (r.status_kk||"").trim(),
      lahir: (r.lahir||"").trim(),
      wafat: (r.wafat||"").trim(),
      id_ortu: (r.id_ortu||"").trim(),
      id_pasangan: (r.id_pasangan||"").trim(),
      keterangan: (r.keterangan||"").trim()
    })).filter(p => p.id && p.nama);

    people = {};
    list.forEach(p => people[p.id] = p);

    const depth = computeGenerations(list);
    list.forEach(p => p.gen = depth[p.id]);

    list.forEach(p => {
      p.anak = list.filter(c => c.id_ortu === p.id || (p.id_pasangan && c.id_ortu === p.id_pasangan)).map(c => c.id);
    });

    return list;
  }

  function renderStats(list){
    const gens = new Set(list.map(p => p.gen));
    const kks = new Set(list.map(p => p.kk).filter(Boolean));
    document.getElementById('stats').innerHTML =
      '<span class="stat-pill">' + gens.size + ' generasi</span>' +
      '<span class="stat-pill">' + list.length + ' anggota</span>' +
      '<span class="stat-pill">' + kks.size + ' kartu keluarga</span>';
  }

  function isBloodline(p){
    return !!p.id_ortu || (!p.id_pasangan);
  }

  function personLabel(p){
    let s = p.nama;
    if(p.lahir || p.wafat) s += ' — ' + (p.lahir||'?') + (p.wafat ? '–'+p.wafat : (p.lahir ? ' – sekarang' : ''));
    return s;
  }

  function render(list){
    const root = document.getElementById('tree');
    root.innerHTML = "";

    const byGen = {};
    list.forEach(p => {
      if(!isBloodline(p) && p.id_pasangan && byGen[p.gen] !== undefined){
        // spouse handled inline under their partner, skip standalone row
      }
      if(!byGen[p.gen]) byGen[p.gen] = [];
      byGen[p.gen].push(p);
    });

    const genKeys = Object.keys(byGen).map(Number).sort((a,b)=>a-b);
    let anyVisible = false;

    genKeys.forEach(g => {
      const members = byGen[g]
        .filter(p => isBloodline(p) || !p.id_ortu === false ? true : true)
        .filter(p => isBloodline(p));
      const q = query.toLowerCase();
      const visibleMembers = members.filter(p => {
        if(!q) return true;
        const spouse = p.id_pasangan ? people[p.id_pasangan] : null;
        return p.nama.toLowerCase().includes(q) || (spouse && spouse.nama.toLowerCase().includes(q));
      });
      if(visibleMembers.length === 0) return;
      anyVisible = true;

      const isOpen = query ? true : !!openGen[g];

      const block = document.createElement('div');
      block.className = 'gen-block';

      const header = document.createElement('button');
      header.className = 'gen-header' + (isOpen ? ' open' : '');
      header.innerHTML =
        '<span class="left"><span class="roman">Generasi ' + romanize(g) + '</span>' +
        '<span class="count">&middot; ' + visibleMembers.length + ' orang</span></span>' +
        '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
      header.onclick = () => { openGen[g] = !openGen[g]; renderAll(); };
      block.appendChild(header);

      if(isOpen){
        const body = document.createElement('div');
        body.className = 'gen-body';
        const thread = document.createElement('div');
        thread.className = 'thread';
        body.appendChild(thread);

        visibleMembers.forEach(p => {
          body.appendChild(renderPersonRow(p));
        });

        block.appendChild(body);
      }
      root.appendChild(block);
    });

    document.getElementById('emptyState').style.display = anyVisible ? 'none' : 'block';
  }

  function renderPersonRow(p){
    const row = document.createElement('div');
    row.className = 'person-row';

    const dot = document.createElement('div');
    dot.className = 'node-dot';
    row.appendChild(dot);

    const card = document.createElement('div');
    card.className = 'card';
    const spouse = p.id_pasangan ? people[p.id_pasangan] : null;

    card.innerHTML =
      '<div class="row">' +
        '<div class="avatar">' + initialsOf(p.nama) + '</div>' +
        '<div class="who">' +
          '<div class="nm name">' + p.nama + (spouse ? ' &amp; ' + spouse.nama : '') + '</div>' +
          '<div class="meta">' + (p.lahir||'?') + (p.wafat ? '–'+p.wafat : '') + '</div>' +
        '</div>' +
        (p.kk ? '<span class="kk-badge">' + p.kk + '</span>' : '') +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.5; flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</div>';

    card.onclick = () => { openMember = (openMember === p.id) ? null : p.id; renderAll(); };
    row.appendChild(card);

    if(openMember === p.id){
      const det = document.createElement('div');
      det.className = 'detail';
      let html = '';
      if(p.keterangan) html += '<div class="line">' + p.keterangan + '</div>';
      if(spouse) html += '<div class="line">Pasangan: <b>' + spouse.nama + '</b></div>';
      if(p.id_ortu && people[p.id_ortu]) html += '<div class="line">Anak dari: <b>' + people[p.id_ortu].nama + '</b></div>';
      if(p.anak && p.anak.length){
        html += '<div class="line">Anak (' + p.anak.length + '):</div><div class="chips">' +
          p.anak.map(cid => people[cid] ? '<span class="chip" data-jump="'+cid+'">' + people[cid].nama + '</span>' : '').join('') +
          '</div>';
      }
      det.innerHTML = html;
      det.querySelectorAll('.chip').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const cid = el.getAttribute('data-jump');
          const target = people[cid];
          if(target){ openGen[target.gen] = true; openMember = cid; renderAll(); }
        };
      });
      row.appendChild(det);
    }
    return row;
  }

  let fullList = [];

  function renderAll(){
    render(fullList);
  }

  function start(csvText, isSample){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('configNote').style.display = isSample ? 'block' : 'none';
    fullList = buildTree(csvText);
    if(fullList.length){
      const minGen = Math.min(...fullList.map(p=>p.gen));
      openGen[minGen] = true;
    }
    renderStats(fullList);
    renderAll();
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    query = e.target.value;
    renderAll();
  });

  if(SHEET_CSV_URL.indexOf('GANTI_DENGAN_LINK') === 0){
    start(SAMPLE_CSV, true);
  } else {
    fetch(SHEET_CSV_URL)
      .then(r => r.text())
      .then(csv => start(csv, false))
      .catch(() => start(SAMPLE_CSV, true));
  }
</script>
</body>
</html>
